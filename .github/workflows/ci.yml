name: CI

on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions: { contents: read }

jobs:
  backend:
    name: Backend - build, unit + Testcontainers ITs, coverage gate
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: jacoco-reports, path: backend/*/target/site/jacoco/, retention-days: 7 }

  frontend:
    name: Frontend - typecheck, tests + coverage gate, build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm coverage
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with: { name: frontend-dist, path: frontend/dist, retention-days: 7 }

  e2e:
    name: End-to-end - full stack + Playwright + API smoke test
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - name: Kafka (KRaft)
        run: |
          docker run -d --name kafka -p 9092:9092 -e KAFKA_NODE_ID=1 -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 apache/kafka:3.8.1
      - name: Databases and secrets
        env: { PGPASSWORD: postgres }
        run: |
          DBPW=$(openssl rand -hex 16)
          psql -h localhost -U postgres -c "CREATE ROLE aeroflow LOGIN PASSWORD '$DBPW'"
          psql -h localhost -U postgres -f infra/db/init.sql
          for d in auth flight passenger booking checkin notification reporting; do psql -h localhost -U postgres -c "ALTER DATABASE aeroflow_$d OWNER TO aeroflow"; done
          printf "JWT_SECRET=%s\nDB_USERNAME=aeroflow\nDB_PASSWORD=%s\nDEMO_PASSWORD=Aeroflow@2026\n" "$(openssl rand -base64 48 | tr -d '\n')" "$DBPW" > .env
      - run: scripts/local-backend.sh build && scripts/local-backend.sh start
      - name: Wait for all services
        run: for i in $(seq 1 60); do [ "$(scripts/local-backend.sh status | grep -c ' 200')" = 8 ] && exit 0; sleep 5; done; scripts/local-backend.sh status; exit 1
      - run: python3 scripts/smoke_test.py http://localhost:8080
      - working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium && pnpm e2e
      - if: failure()
        run: tail -n 80 .local/logs/*.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: frontend/playwright-report, retention-days: 7 }

  images:
    name: Docker images -> GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [e2e]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        service: [gateway, auth-service, flight-service, passenger-service, booking-service, checkin-service, notification-service, reporting-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/aeroflow-${{ matrix.service }}:latest,ghcr.io/${{ github.repository_owner }}/aeroflow-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
