# Render Blueprint (https://render.com/docs/blueprint-spec). Deploy: Render dashboard -> New -> Blueprint -> this repo.
# Kafka-free: events flow through the PostgreSQL event bus (schema "eventbus") in the shared database.
# One Postgres instance, one schema per service (DB_SCHEMA + currentSchema) - services still never share tables.
envVarGroups:
  - name: aeroflow-shared
    envVars:
      - { key: JWT_SECRET, generateValue: true }
      - { key: ADMIN_EMAIL, sync: false }
      - { key: ADMIN_PASSWORD, sync: false }

databases:
  - { name: aeroflow-db, databaseName: aeroflow, plan: basic-256mb }

services:
  - type: keyvalue
    name: aeroflow-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: aeroflow-gateway
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/docker/gateway.Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health/readiness
    envVars:
      - { key: SERVICE, value: gateway }
      - { key: PORT, value: "10000" }
      - { key: CORS_ALLOWED_ORIGINS, value: "https://aeroflow-chi.vercel.app" }
      - { key: CORS_ALLOWED_ORIGIN_PATTERNS, value: "https://aeroflow-*-fareedshaikh2692-2964s-projects.vercel.app" }
      - { key: REDIS_URL, fromService: { type: keyvalue, name: aeroflow-redis, property: connectionString } }
      - { key: AUTH_SERVICE_URL, value: "http://aeroflow-auth-service:10000" }
      - { key: FLIGHT_SERVICE_URL, value: "http://aeroflow-flight-service:10000" }
      - { key: PASSENGER_SERVICE_URL, value: "http://aeroflow-passenger-service:10000" }
      - { key: BOOKING_SERVICE_URL, value: "http://aeroflow-booking-service:10000" }
      - { key: CHECKIN_SERVICE_URL, value: "http://aeroflow-checkin-service:10000" }
      - { key: NOTIFICATION_SERVICE_URL, value: "http://aeroflow-notification-service:10000" }
      - { key: REPORTING_SERVICE_URL, value: "http://aeroflow-reporting-service:10000" }

  - type: pserv
    name: aeroflow-auth-service
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/docker/auth-service.Dockerfile
    dockerContext: ./backend
    envVars:
      - { key: SERVICE, value: auth-service }
      - { key: PORT, value: "10000" }
      - { key: DB_SCHEMA, value: auth }
      - { key: DB_URL, value: "jdbc:postgresql://${DB_HOST}:5432/aeroflow?currentSchema=auth" }
      - { key: JWT_SECRET, fromGroup: aeroflow-shared }
      - { key: SPRING_PROFILES_ACTIVE, value: "json-logs" }
      - { key: EVENTS_TRANSPORT, value: postgres }
      - { key: SEED_DEMO_USERS, value: "false" }
      - { key: SEED_SYNTHETIC_HISTORY, value: "false" }
      - { key: SEED_FLIGHTS, value: "true" }
      - { key: ADMIN_EMAIL, fromGroup: aeroflow-shared }
      - { key: ADMIN_PASSWORD, fromGroup: aeroflow-shared }
      - { key: REDIS_URL, fromService: { type: keyvalue, name: aeroflow-redis, property: connectionString } }
      - { key: DB_USERNAME, fromDatabase: { name: aeroflow-db, property: user } }
      - { key: DB_PASSWORD, fromDatabase: { name: aeroflow-db, property: password } }
      - { key: DB_HOST, fromDatabase: { name: aeroflow-db, property: host } }
      - { key: FLIGHT_SERVICE_URL, value: "http://aeroflow-flight-service:10000" }
      - { key: BOOKING_SERVICE_URL, value: "http://aeroflow-booking-service:10000" }

