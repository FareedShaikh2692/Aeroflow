# Render Blueprint - FREE tier: one web service running every AeroFlow service in a single JVM.
# Database: Neon free PostgreSQL (https://neon.tech). Use the DIRECT connection host (not "-pooler"),
# because the event bus uses session advisory locks and each connection sets search_path.
# No Kafka (PostgreSQL event bus) and no Redis (in-memory cache).
# Paid, 8-service deployment: infra/render/render.microservices.yaml
services:
  - type: web
    name: aeroflow-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/docker/all-in-one.Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health/readiness
    autoDeploy: true
    envVars:
      - { key: DB_URL, sync: false }        # jdbc:postgresql://ep-xxxx.<region>.aws.neon.tech/neondb?sslmode=require
      - { key: DB_USERNAME, sync: false }   # e.g. neondb_owner
      - { key: DB_PASSWORD, sync: false }
      - { key: ADMIN_EMAIL, sync: false }   # first SUPER_ADMIN
      - { key: ADMIN_PASSWORD, sync: false }
      - { key: JWT_SECRET, generateValue: true }
      - { key: CORS_ALLOWED_ORIGINS, value: "https://aeroflow-chi.vercel.app" }
      - { key: CORS_ALLOWED_ORIGIN_PATTERNS, value: "https://aeroflow-*-fareedshaikh2692-2964s-projects.vercel.app" }
      - { key: SEED_DEMO_USERS, value: "false" }
      - { key: SEED_SYNTHETIC_HISTORY, value: "false" }
      - { key: SEED_FLIGHTS, value: "true" }
      - { key: DB_POOL_SIZE, value: "5" }
      - { key: SPRING_PROFILES_ACTIVE, value: "json-logs" }
