      - { key: ADMIN_PASSWORD, fromGroup: aeroflow-shared }
      - { key: REDIS_URL, fromService: { type: keyvalue, name: aeroflow-redis, property: connectionString } }
      - { key: DB_USERNAME, fromDatabase: { name: aeroflow-db, property: user } }
      - { key: DB_PASSWORD, fromDatabase: { name: aeroflow-db, property: password } }
      - { key: DB_HOST, fromDatabase: { name: aeroflow-db, property: host } }
