# AeroFlow single-deployable (free tier): every service in one JVM, one PostgreSQL database
# (one schema per service + "eventbus"), no Kafka, no Redis, no gateway.
spring:
  application:
    name: aeroflow
  config:
    # later imports win: all-in-one overrides must load after the shared defaults
    import: classpath:aeroflow-common.yml, classpath:all-in-one-overrides.yml
server:
  port: ${PORT:8080}
aeroflow:
  security:
    public-paths: >-
      /api/auth/login,/api/auth/refresh,/api/auth/register,/api/auth/logout,
      /api/airports/**,/api/flights/search,/api/flights/public/**,
      /api/seat-maps/**,/api/bookings/retrieve,/api/bookings/guest/**,/api/bookings/quote,
      /api/checkin/retrieve,/api/checkin/seat,/api/checkin/complete,/api/checkin/boarding-pass
    refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
    max-failed-logins: 5
    lockout: 15m
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
  services:
    flight-url: http://127.0.0.1:${server.port}
    booking-url: http://127.0.0.1:${server.port}
  booking:
    min-minutes-before-departure: 45
    reminder-window-hours: 24
  checkin:
    opens-hours-before: ${CHECKIN_OPENS_HOURS:48}
    closes-minutes-before: ${CHECKIN_CLOSES_MINUTES:60}
  notifications:
    email-from: ${NOTIFY_EMAIL_FROM:no-reply@aeroflow.dev}
  seed:
    demo-users: ${SEED_DEMO_USERS:${SEED_DEMO_DATA:true}}
    demo-password: ${DEMO_PASSWORD:Aeroflow@2026}
    flights: ${SEED_FLIGHTS:${SEED_DEMO_DATA:true}}
    synthetic-history: ${SEED_SYNTHETIC_HISTORY:${SEED_DEMO_DATA:true}}
  bootstrap:
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
