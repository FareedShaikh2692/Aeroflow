spring:
  application:
    name: flight-service
  config:
    import: classpath:aeroflow-common.yml
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 1s
  cache:
    type: redis
server:
  port: ${PORT:8082}
aeroflow:
  db-name: aeroflow_flight
  security:
    public-paths: /api/airports/**,/api/flights/search,/api/flights/public/**
  services:
    booking-url: ${BOOKING_SERVICE_URL:http://localhost:8084}
  seed:
    flights: ${SEED_FLIGHTS:${SEED_DEMO_DATA:true}}
