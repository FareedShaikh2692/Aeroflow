spring:
  application:
    name: gateway
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 15s
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
        - name: Retry
          args:
            retries: 2
            methods: GET
            statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
            backoff: { firstBackoff: 100ms, maxBackoff: 1s, factor: 2, basedOnPreviousValue: false }
      routes:
        - id: block-internal
          uri: no://op
          predicates:
            - Path=/internal/**,/api/*/internal/**
          filters:
            - SetStatus=404
        - id: auth-login
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/login,/api/auth/register,/api/auth/refresh
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@clientIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${AUTH_RATE_PER_SEC:5}
                redis-rate-limiter.burstCapacity: ${AUTH_RATE_BURST:20}
                deny-empty-key: false
        - id: auth
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**,/api/users/**
        - id: flight
          uri: ${FLIGHT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/flights/**,/api/airports/**,/api/aircraft/**
        - id: passenger
          uri: ${PASSENGER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/passengers/**
        - id: booking
          uri: ${BOOKING_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/bookings/**,/api/seat-maps/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@clientIpKeyResolver}"
                redis-rate-limiter.replenishRate: ${BOOKING_RATE_PER_SEC:20}
                redis-rate-limiter.burstCapacity: ${BOOKING_RATE_BURST:60}
                deny-empty-key: false
        - id: checkin
          uri: ${CHECKIN_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/checkin/**
        - id: notification
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/notifications/**
        - id: reporting
          uri: ${REPORTING_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/reports/**,/api/audit/**
server:
  port: ${PORT:8080}
  shutdown: graceful
aeroflow:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,gateway
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: true
  metrics:
    tags:
      application: gateway
