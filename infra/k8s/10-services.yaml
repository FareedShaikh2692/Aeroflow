apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway, namespace: aeroflow, labels: { app: gateway, app.kubernetes.io/part-of: aeroflow } }
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: gateway } }
  template:
    metadata:
      labels: { app: gateway }
      annotations: { prometheus.io/scrape: "true", prometheus.io/path: /actuator/prometheus, prometheus.io/port: "8080" }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 100, fsGroup: 101 }
      containers:
        - name: gateway
          image: ghcr.io/OWNER/aeroflow-gateway:latest
          ports: [{ containerPort: 8080, name: http }]
          envFrom: [{ configMapRef: { name: aeroflow-config } }, { secretRef: { name: aeroflow-secrets } }]
          env:
            - { name: PORT, value: "8080" }
          resources: { requests: { cpu: 100m, memory: 384Mi }, limits: { memory: 640Mi } }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: http }, initialDelaySeconds: 20, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: http }, initialDelaySeconds: 60, periodSeconds: 20 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: gateway, namespace: aeroflow }
spec: { selector: { app: gateway }, ports: [{ port: 80, targetPort: http, name: http }] }
---
