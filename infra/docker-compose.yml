# AeroFlow local stack:  docker compose --env-file ../.env up -d --build      (from ./infra)
name: aeroflow
x-service: &service
  restart: unless-stopped
  environment: &env
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    DB_USERNAME: aeroflow
    DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    REDIS_URL: redis://redis:6379
    EVENTS_TRANSPORT: ${EVENTS_TRANSPORT:-postgres}
    EVENTS_DB_URL: jdbc:postgresql://postgres:5432/aeroflow_events
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    DEMO_PASSWORD: ${DEMO_PASSWORD:-Aeroflow@2026}
    FLIGHT_SERVICE_URL: http://flight-service:8080
    BOOKING_SERVICE_URL: http://booking-service:8080
    JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75 -XX:+UseSerialGC
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  deploy: { resources: { limits: { memory: 512m } } }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      AEROFLOW_DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
      - ./db/roles.sh:/docker-entrypoint-initdb.d/20-roles.sh:ro
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 20 }

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20 }

  kafka:   # optional: docker compose --profile kafka up  (and EVENTS_TRANSPORT=kafka)
    profiles: [kafka]
    image: apache/kafka:3.8.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: -Xmx384m -Xms128m
    volumes: ["kafkadata:/var/lib/kafka/data"]
    ports: ["29092:29092"]
    healthcheck: { test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"], interval: 10s, retries: 20 }

  auth-service:
    <<: *service
    image: aeroflow/auth-service:local
    build: { context: ../backend, args: { SERVICE: auth-service } }
    environment:
      <<: *env
      DB_URL: jdbc:postgresql://postgres:5432/aeroflow_auth
    ports: ["8081:8080"]

  flight-service:
    <<: *service
    image: aeroflow/flight-service:local
    build: { context: ../backend, args: { SERVICE: flight-service } }
    environment:
      <<: *env
      DB_URL: jdbc:postgresql://postgres:5432/aeroflow_flight
    ports: ["8082:8080"]

  passenger-service:
    <<: *service
    image: aeroflow/passenger-service:local
    build: { context: ../backend, args: { SERVICE: passenger-service } }
    environment:
      <<: *env
      DB_URL: jdbc:postgresql://postgres:5432/aeroflow_passenger
    ports: ["8083:8080"]

  booking-service:
    <<: *service
    image: aeroflow/booking-service:local
    build: { context: ../backend, args: { SERVICE: booking-service } }
    environment:
      <<: *env
      DB_URL: jdbc:postgresql://postgres:5432/aeroflow_booking
    ports: ["8084:8080"]

  checkin-service:
    <<: *service
    image: aeroflow/checkin-service:local
    build: { context: ../backend, args: { SERVICE: checkin-service } }
    environment:
      <<: *env
      DB_URL: jdbc:postgresql://postgres:5432/aeroflow_checkin
    ports: ["8085:8080"]

  notification-service:
    <<: *service
    image: aeroflow/notification-service:local
    build: { context: ../backend, args: { SERVICE: notification-service } }
    environment:
      <<: *env
      DB_URL: jdbc:postgresql://postgres:5432/aeroflow_notification
    ports: ["8086:8080"]

  reporting-service:
    <<: *service
    image: aeroflow/reporting-service:local
    build: { context: ../backend, args: { SERVICE: reporting-service } }
    environment:
      <<: *env
      DB_URL: jdbc:postgresql://postgres:5432/aeroflow_reporting
    ports: ["8087:8080"]

  gateway:
    image: aeroflow/gateway:local
    build: { context: ../backend, args: { SERVICE: gateway } }
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      AUTH_SERVICE_URL: http://auth-service:8080
      FLIGHT_SERVICE_URL: http://flight-service:8080
      PASSENGER_SERVICE_URL: http://passenger-service:8080
      BOOKING_SERVICE_URL: http://booking-service:8080
      CHECKIN_SERVICE_URL: http://checkin-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      REPORTING_SERVICE_URL: http://reporting-service:8080
    depends_on: { redis: { condition: service_healthy } }
    ports: ["8080:8080"]

  frontend:
    image: aeroflow/frontend:local
    build: { context: ../frontend }
    depends_on: [gateway]
    ports: ["3000:80"]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    ports: ["3001:3000"]

volumes: { pgdata: {}, redisdata: {}, kafkadata: {} }
